<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Center node radial gradient (purple glow) -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#8338EC"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>

    <!-- Outer cyan node gradient -->
    <radialGradient id="cyanGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </radialGradient>

    <!-- Pink accent node gradient -->
    <radialGradient id="pinkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D9D"/>
      <stop offset="100%" stop-color="#FF006E"/>
    </radialGradient>

    <!-- Line gradient (cyan to purple) -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8338EC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for center -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow aura -->
  <circle cx="100" cy="100" r="85" fill="url(#centerGrad)" opacity="0.08"/>

  <!-- Connecting lines from center to each outer node -->
  <g stroke="url(#lineGrad)" stroke-width="1.2" filter="url(#glow)" fill="none">
    <line x1="100" y1="100" x2="100" y2="35"/>
    <line x1="100" y1="100" x2="156" y2="68"/>
    <line x1="100" y1="100" x2="156" y2="132"/>
    <line x1="100" y1="100" x2="100" y2="165"/>
    <line x1="100" y1="100" x2="44" y2="132"/>
    <line x1="100" y1="100" x2="44" y2="68"/>
  </g>

  <!-- Hexagon outline connecting outer nodes -->
  <polygon
    points="100,35 156,68 156,132 100,165 44,132 44,68"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="1.2"
    filter="url(#glow)"
    opacity="0.7"
  />

  <!-- Outer nodes (5 cyan + 1 pink accent at bottom-right) -->
  <g filter="url(#glow)">
    <!-- Top -->
    <circle cx="100" cy="35" r="7" fill="url(#cyanGrad)">
      <animate attributeName="r" values="7;8;7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Top Right -->
    <circle cx="156" cy="68" r="7" fill="url(#cyanGrad)">
      <animate attributeName="r" values="7;8;7" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <!-- Bottom Right (PINK ACCENT) -->
    <circle cx="156" cy="132" r="7" fill="url(#pinkGrad)">
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Bottom -->
    <circle cx="100" cy="165" r="7" fill="url(#cyanGrad)">
      <animate attributeName="r" values="7;8;7" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <!-- Bottom Left -->
    <circle cx="44" cy="132" r="7" fill="url(#cyanGrad)">
      <animate attributeName="r" values="7;8;7" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Top Left -->
    <circle cx="44" cy="68" r="7" fill="url(#cyanGrad)">
      <animate attributeName="r" values="7;8;7" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center node (large purple) with pulse animation -->
  <g filter="url(#strongGlow)">
    <circle cx="100" cy="100" r="18" fill="url(#centerGrad)">
      <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner white core -->
    <circle cx="100" cy="100" r="6" fill="#FFFFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>